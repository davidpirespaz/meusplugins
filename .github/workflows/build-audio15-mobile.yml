name: Audio15 Mobile APK (Android)
on:
  push:
    branches: [audio15-mobile-android-20261121]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          test -n "$SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK Android
        working-directory: Audio15Android
        run: gradle --no-daemon assembleDebug
      - name: Verificar APK e assinatura
        run: |
          APK="Audio15Android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          cp "$APK" Audio15_Mobile_Android_WhatsApp_v0.1.apk
          ls -lh Audio15_Mobile_Android_WhatsApp_v0.1.apk
      - name: Arquivo de instalação
        uses: actions/upload-artifact@v4
        with:
          name: Audio15_Mobile_WhatsApp_APK
          path: Audio15_Mobile_Android_WhatsApp_v0.1.apk
          retention-days: 30
