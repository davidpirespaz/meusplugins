name: APK Números 0 a 100 (Galaxy A71)
on:
  push:
    branches: [build-numeros-0a100-20261121]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Preparar Android SDK
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME"
        SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
        test -n "$SDKM"
        yes | "$SDKM" --licenses >/dev/null || true
        "$SDKM" 'platforms;android-35' 'build-tools;35.0.0'
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'
    - name: Compilar APK
      working-directory: NumerosAndroid
      run: gradle --no-daemon assembleDebug
    - name: Verificar integridade e assinatura do APK
      run: |
        APK="NumerosAndroid/app/build/outputs/apk/debug/app-debug.apk"
        test -s "$APK"
        APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
        "$APKSIGNER" verify --verbose --print-certs "$APK"
    - name: Nomear APK
      run: cp NumerosAndroid/app/build/outputs/apk/debug/app-debug.apk Numeros_0_a_100_Galaxy_A71_2s.apk
    - uses: actions/upload-artifact@v4
      with:
        name: APK_Numeros_0_a_100_Galaxy_A71_2s
        path: Numeros_0_a_100_Galaxy_A71_2s.apk
        retention-days: 30
