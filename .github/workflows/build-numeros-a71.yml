name: APK Números 0 a 100 (Galaxy A71)
on:
  push:
    branches: [build-numeros-0a100-20261121]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Preparar Android SDK
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME"
        yes | sdkmanager --licenses >/dev/null || true
        sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'
    - name: Compilar APK
      working-directory: NumerosAndroid
      run: gradle --no-daemon assembleDebug
    - name: Nomear APK
      run: cp NumerosAndroid/app/build/outputs/apk/debug/app-debug.apk Numeros_0_a_100_Galaxy_A71.apk
    - uses: actions/upload-artifact@v4
      with:
        name: APK_Numeros_0_a_100_Galaxy_A71
        path: Numeros_0_a_100_Galaxy_A71.apk
        retention-days: 30
